{% extends "superadmin/base_superadmin.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Edit Tenant: {{ tenant.name }}</h1>
<form method="POST" class="bg-white  p-6 rounded-lg shadow">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <div class="mb-4">
        <label class="block mb-2">Name</label>
        <input type="text" name="name" value="{{ tenant.name }}" required class="border p-2 w-full"/>
    </div>
    <div class="mb-4">
        <label class="block mb-2">Slug</label>
        <input type="text" name="slug" value="{{ tenant.slug }}" required class="border p-2 w-full"/>
    </div>
    <div class="mb-4">
        <label class="flex items-center">
            <input type="checkbox" name="is_active" {% if tenant.is_active %}checked{% endif %} class="mr-2"/>
            Active
        </label>
    </div>
    <button type="submit" class="bg-blue-600 text-white p-2 rounded">Save Changes</button>
</form>
{% endblock %}
