{% extends "superadmin/base_superadmin.html" %}
{% block content %}
<div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
    <h1 class="text-2xl font-bold text-gray-800 ">Manage Tenants</h1>
    <a href="{{ url_for('superadmin.create_tenant') }}" class="flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
        </svg>
        Create Tenant
    </a>
</div>
<div class="bg-white  rounded-lg shadow overflow-hidden">
    <div class="overflow-x-auto">
        <table class="w-full">
            <thead class="bg-gray-50  text-gray-600  uppercase text-xs font-semibold">
                <tr>
                    <th class="p-4 text-left">Name</th>
                    <th class="p-4 text-left">Status</th>
                    <th class="p-4 text-right">Actions</th>
                </tr>
            </thead>
            <tbody class="text-gray-700">
                {% for tenant in tenants %}
                <tr class="border-t hover:bg-gray-50  ">
                    <td class="p-4 font-medium">{{ tenant.name }}</td>
                    <td class="p-4">
                        <span class="px-2 py-1 text-xs rounded-full {{ 'bg-green-100 text-green-800' if tenant.is_active else 'bg-red-100 text-red-800' }}">
                            {{ 'Active' if tenant.is_active else 'Inactive' }}
                        </span>
                    </td>
                    <td class="p-4 flex gap-2 justify-end">
                        <a href="{{ url_for('superadmin.edit_tenant', tenant_id=tenant.id) }}" class="text-blue-600 hover:text-blue-800 p-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                            </svg>
                        </a>
                        <form action="{{ url_for('superadmin.delete_tenant', tenant_id=tenant.id) }}" method="POST" onsubmit="return confirm('Delete tenant?');">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                            <button type="submit" class="text-red-600 hover:text-red-800 p-1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                                </svg>
                            </button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
