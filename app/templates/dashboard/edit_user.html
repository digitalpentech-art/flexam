{% extends 'base.html' %}
{% from 'macros/forms.html' import render_field %}

{% block title %}Edit User{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white  p-8 rounded-lg shadow-sm border border-gray-200 ">
        <h2 class="text-xl font-bold text-gray-800  mb-6">Edit User: {{ user.email }}</h2>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700  mb-1.5">Email</label>
                <input type="email" name="email" value="{{ user.email }}" class="w-full px-4 py-2 border border-gray-300  rounded-lg bg-white  text-gray-900 " required>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700  mb-1.5">First Name</label>
                <input type="text" name="first_name" value="{{ user.first_name or '' }}" class="w-full px-4 py-2 border border-gray-300  rounded-lg bg-white  text-gray-900 ">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700  mb-1.5">Last Name</label>
                <input type="text" name="last_name" value="{{ user.last_name or '' }}" class="w-full px-4 py-2 border border-gray-300  rounded-lg bg-white  text-gray-900 ">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700  mb-1.5">Role</label>
                <select name="role_id" class="w-full px-4 py-2 border border-gray-300  rounded-lg bg-white  text-gray-900 ">
                    <option value="">No Role</option>
                    {% for role in roles %}
                    <option value="{{ role.id }}" {% if user.role_id == role.id %}selected{% endif %}>{{ role.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="flex gap-4">
                <button type="submit" class="bg-primary text-white font-semibold py-2 px-6 rounded-lg hover:bg-blue-800 transition">Save Changes</button>
                <a href="{{ url_for('admin.manage_users') }}" class="bg-gray-200  text-gray-800  font-semibold py-2 px-6 rounded-lg hover:bg-gray-300  transition">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
