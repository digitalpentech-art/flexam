{% extends 'base.html' %}

{% block title %}Taking Exam{% endblock %}

{% block content %}
<div id="exam-app" class="max-w-6xl mx-auto flex gap-6">
    <!-- Main Exam Area -->
    <div class="flex-grow space-y-6">
        <div class="bg-white p-6 rounded shadow flex justify-between items-center">
            <h2 id="exam-name" class="text-2xl font-bold">Loading...</h2>
            <div id="timer" class="text-xl font-mono font-bold bg-red-100 text-red-800 p-2 rounded">--:--</div>
        </div>
        
        <div id="question-container" class="bg-white p-6 rounded shadow min-h-[400px]">
            <!-- Content injected by JS -->
        </div>
        
        <div class="flex justify-between">
            <button id="prev-btn" class="bg-gray-300 px-4 py-2 rounded">Previous</button>
            <button id="next-btn" class="bg-blue-600 text-white px-4 py-2 rounded">Next</button>
        </div>
    </div>
    
    <!-- Question Palette -->
    <div id="palette" class="w-64 bg-white p-6 rounded shadow">
        <h3 class="font-bold mb-4">Questions</h3>
        <div id="palette-grid" class="grid grid-cols-4 gap-2">
            <!-- Palette buttons injected by JS -->
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/exam_runtime.js') }}"></script>
<script>
    const attemptId = "{{ attempt_id }}";
    initExamRuntime(attemptId);
</script>
{% endblock %}
