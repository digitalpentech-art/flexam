{% extends 'base.html' %}

{% block title %}Taking Exam{% endblock %}

{% block content %}
<div id="exam-app" class="max-w-6xl mx-auto flex flex-col-reverse lg:flex-row gap-6">
    <!-- Main Exam Area -->
    <div class="flex-grow space-y-4">
        <div class="bg-white  p-4 rounded-lg shadow-sm border border-gray-200  flex justify-between items-center sticky top-20 z-10">
            <h2 id="exam-name" class="text-lg font-bold text-gray-800 ">Loading...</h2>
            <div id="timer" class="text-md font-mono font-bold bg-red-50 text-red-700 p-2 rounded border border-red-100">--:--</div>
        </div>

        <div id="question-container" class="bg-white  p-6 rounded-lg shadow-sm border border-gray-200  min-h-[300px] prose prose-sm md:prose-lg max-w-none">
            <!-- Content injected by JS -->
    <div id="response-area" class="mt-6 border-t pt-4">
        <div id="mode-selector" class="mb-4 flex gap-2">
            <!-- Buttons for 'keyboard', 'file', etc. populated by JS -->
        </div>
        <div id="input-container">
            <!-- Typed Input -->
            <textarea id="text-input" class="w-full h-48 p-3 border rounded-lg hidden"></textarea>
            
            <!-- File Upload -->
            <input type="file" id="file-input" class="hidden">
            <div id="upload-zone" class="hidden border-2 border-dashed p-6 text-center">Drag files here...</div>
        </div>
    </div>
</div>

<script>
    // Simplified logic to show/hide based on response mode
    function setResponseMode(mode) {
        document.getElementById('text-input').classList.toggle('hidden', mode !== 'keyboard');
        document.getElementById('file-input').classList.toggle('hidden', mode !== 'file');
        document.getElementById('upload-zone').classList.toggle('hidden', mode !== 'file');
    }

    // In your existing initExamRuntime or question loading logic,
    // fetch allowed_response_modes and call setResponseMode(mode)
</script>

        <div class="flex justify-between gap-4">
            <button id="prev-btn" class="bg-gray-200 text-gray-800  font-semibold px-6 py-3 rounded-lg hover:bg-gray-300 transition flex-1">Previous</button>
            <button id="next-btn" class="bg-primary text-white font-semibold px-6 py-3 rounded-lg hover:bg-blue-800 transition flex-1">Next</button>
        </div>
    </div>

    <!-- Question Palette -->
    <div id="palette" class="w-full lg:w-72 bg-white  p-6 rounded-lg shadow-sm border border-gray-200  h-fit">
        <h3 class="font-bold mb-4 text-gray-800  text-sm uppercase tracking-wide">Question Palette</h3>
        <div id="palette-grid" class="grid grid-cols-6 sm:grid-cols-8 lg:grid-cols-4 gap-2 mb-6">
            <!-- Palette buttons injected by JS -->
        </div>

        <button id="submit-btn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition shadow-sm">
            Submit Exam
        </button>
    </div>
</div>
... (script block remains unchanged) ...
{% endblock %}

<script>
    const attemptId = "{{ attempt_id }}";
    initExamRuntime(attemptId);
</script>
{% endblock %}
