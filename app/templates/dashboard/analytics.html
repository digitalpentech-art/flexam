{% extends 'base.html' %}

{% block title %}Analytics Dashboard{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-6">
    <h2 class="text-2xl font-bold text-gray-800  mb-6">Analytics Dashboard</h2>
    
    <div id="analytics-app" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-white  p-6 rounded-lg shadow-sm border border-gray-200 ">
            <h3 class="text-xs font-semibold text-gray-500  uppercase tracking-wide">Average Score</h3>
            <p id="avg-score" class="text-4xl font-bold text-primary mt-2">--</p>
        </div>
        <div class="bg-white  p-6 rounded-lg shadow-sm border border-gray-200 ">
            <h3 class="text-xs font-semibold text-gray-500  uppercase tracking-wide">Total Attempts</h3>
            <p id="total-attempts" class="text-4xl font-bold text-gray-800  mt-2">--</p>
        </div>
    </div>
</div>

<script>
    async function loadAnalytics() {
        const response = await fetch('/api/analytics/summary');
        if (response.ok) {
            const data = await response.json();
            document.getElementById('avg-score').innerText = data.average_score + '%';
            document.getElementById('total-attempts').innerText = data.total_attempts;
        }
    }
    loadAnalytics();
</script>
{% endblock %}
