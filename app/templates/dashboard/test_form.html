{% extends 'base.html' %}
{% import 'macros/forms.html' as forms %}

{% block title %}Test Form - {{ entity.name }}{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto bg-white  p-6 rounded-lg shadow-sm border border-gray-200 ">
    <h2 class="text-2xl font-bold text-gray-800  mb-6">Create {{ entity.name }}</h2>
    <form action="/api/records/{{ entity.id }}/" method="POST">
        {% for field in entity.fields %}
            {{ forms.render_field(field) }}
        {% endfor %}
        <button type="submit" class="w-full bg-primary text-white font-semibold py-3 rounded-lg hover:bg-blue-800 transition">Submit</button>
    </form>
</div>
{% endblock %}
