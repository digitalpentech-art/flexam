{% extends 'base.html' %}

{% block title %}Administrator Dashboard{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto space-y-8">
    <h2 class="text-3xl font-extrabold text-gray-900">Admin Dashboard</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <div class="bg-white p-8 rounded-2xl shadow-sm hover:shadow-md transition">
            <h3 class="text-xl font-bold mb-2">Entity Management</h3>
            <p class="mb-4 text-gray-600">Define custom entities for your institution.</p>
            <a href="#" class="text-blue-600 font-semibold hover:text-blue-800 transition">Manage Entities &rarr;</a>
        </div>
        <div class="bg-white p-8 rounded-2xl shadow-sm hover:shadow-md transition">
            <h3 class="text-xl font-bold mb-2">Assessment Builder</h3>
            <p class="mb-4 text-gray-600">Create and configure new assessments.</p>
            <a href="#" class="text-blue-600 font-semibold hover:text-blue-800 transition">Build Assessments &rarr;</a>
        </div>
    </div>
</div>
{% endblock %}
