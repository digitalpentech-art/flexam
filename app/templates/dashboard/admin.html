{% extends 'base.html' %}

{% block title %}Administrator Dashboard{% endblock %}

{% block content %}
<div class="space-y-6">
    <h2 class="text-3xl font-bold">Admin Dashboard</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="bg-white p-6 rounded shadow">
            <h3 class="text-xl font-semibold mb-2">Entity Management</h3>
            <p class="mb-4 text-gray-600">Define custom entities for your institution.</p>
            <a href="#" class="text-blue-600 hover:underline">Manage Entities</a>
        </div>
        <div class="bg-white p-6 rounded shadow">
            <h3 class="text-xl font-semibold mb-2">Assessment Builder</h3>
            <p class="mb-4 text-gray-600">Create and configure new assessments.</p>
            <a href="#" class="text-blue-600 hover:underline">Build Assessments</a>
        </div>
    </div>
</div>
{% endblock %}
